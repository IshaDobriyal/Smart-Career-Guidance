
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1efff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 40px;
            width: 350px;
            border-radius: 18px;
            box-shadow: 0 5px 25px #ccc;
            text-align: center;
        }

        h2 {
            color: #5145cd;
            margin-bottom: 30px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 12px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #5145cd;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
        }

        button:hover {
            background: #392eaa;
        }

        a {
            color: #5145cd;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Student Login</h2>

        <form method="POST">
            {% csrf_token %}

            <input type="email" name="email"
                   placeholder="Email Address" required>

            <input type="password" name="password"
                   placeholder="Password" required>

            <button type="submit">Login Now</button>
        </form>

        <p>Don't have an account?
            <a href="/register/">Register Here</a>
        </p>
    </div>
</body>
</html>
